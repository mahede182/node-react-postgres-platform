apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-dev
  labels:
    app: postgres
    environment: dev
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/postgres-dev
    type: DirectoryOrCreate
